<form method="post" action="{% url 'main:toggle_experience_star' experience.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in experience.stars.all %} is-starred{% endif %}"
            title="{% if experience.stars.all %}Dibintangi oleh {{ experience.stars.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in experience.stars.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ experience.stars.count }}</span>
    </button>
</form>
