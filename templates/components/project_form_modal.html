{# Dipakai untuk tambah dan edit proyek. #}
<div id="add-project-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-labelledby="add-project-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-project-modal"
            popovertargetaction="hide"
            tabindex="-1"
            aria-label="Tutup form proyek"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-project-modal"
                popovertargetaction="hide"
                aria-label="Tutup form proyek">&times;</button>

        <h2 id="add-project-modal-title">Tambah Proyek Baru</h2>
        <form id="project-form"
              method="post"
              action="{% url 'main:create_project' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            {# Pesan validasi dari server (diisi lewat JS) #}
            <div id="project-form-errors" class="form-errors hide" role="alert"></div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-project-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Proyek</button>
            </div>
        </form>
    </div>
</div>
